events {}

http {
  resolver 127.0.0.11 valid=30s;

  # 
  # Configuracion rate limit
  #
  limit_req_zone $binary_remote_addr zone=backend:50m rate=45r/s;
  limit_req_zone $binary_remote_addr zone=frontend:50m rate=15r/s;
  
  server {
    listen 80;

    #
    # Seccion para el backend
    #
    location /api/ {
      proxy_pass http://backend:3000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # Rate limiting
      limit_req zone=backend;
    }

    location /socket.io/ {
      proxy_pass http://backend:3000/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Rate limiting
      limit_req zone=backend;
    }

    #
    # Seccion para el frontend
    #
    location / {
      proxy_pass http://frontend:4000/;
      proxy_set_header Host $host;

      # Rate limiting
      limit_req zone=frontend;
    }
  }
}