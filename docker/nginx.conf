events {}

http {
  resolver 127.0.0.11 valid=30s;

  #
  # Configuracion rate limit
  #
  limit_req_zone $binary_remote_addr zone=backend:50m rate=200r/s;
  limit_req_zone $binary_remote_addr zone=frontend:50m rate=100r/s;

  server {
    listen 80;

    #
    # Seccion para el backend
    #
    location /api/ {
      proxy_pass http://backend:3000/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # Rate limiting
      limit_req zone=backend burst=100 nodelay;

      # Fix para el Ip en better auth
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Recursos
      client_max_body_size 600M;
    }

    location /socket.io/ {
      proxy_pass http://backend:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;

      #
      # Fix - conexion por inactividad
      #
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    #
    # Seccion para el frontend
    #
    location / {
      proxy_pass http://frontend:4000/;
      proxy_set_header Host $host;

      # Rate limiting
      limit_req zone=frontend;
    }
  }
}