services:
  postgres:
    image: postgres:16-alpine
    container_name: pet_postgres
    restart: unless-stopped

    # Solo para desarollo local
    #
    # ports:
    #   - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: ghcr.io/baa4ts/pet-backend-beta:latest
    restart: unless-stopped

    # Solo para desarollo local
    #
    # ports:
    #   - "${PORT}:${PORT}"
    
    environment:
      PORT: "${PORT}"
      NODE_ENV: "${NODE_ENV}"
      DATABASE_URL: "${DATABASE_URL}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      STATIC: "${STATIC}"
      CSRF_BETTER: "${CSRF_BETTER}"
      CORS: "${CORS}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
  frontend:
    image: ghcr.io/baa4ts/pet-frontend-beta-4:latest
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres_data:
